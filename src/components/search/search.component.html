<form (submit)="onSearch(); $event.preventDefault()" class="flex items-center gap-2 max-w-lg mx-auto">
  <input
    type="text"
    placeholder="Search for a city..."
    [value]="searchQuery()"
    (input)="handleInput($event)"
    class="w-full px-4 py-3 bg-white/10 text-white rounded-lg border border-white/20 focus:ring-2 focus:ring-blue-400 focus:outline-none placeholder-gray-400 transition duration-300"
  />
  <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-5 rounded-lg transition duration-300 flex-shrink-0">
    Search
  </button>
</form>
