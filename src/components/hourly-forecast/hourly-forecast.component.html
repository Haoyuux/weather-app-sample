<div class="bg-white/10 backdrop-blur-md p-6 rounded-2xl border border-white/20 shadow-lg">
  <h3 class="text-xl font-bold mb-4">Hourly Forecast</h3>
  <div class="flex overflow-x-auto pb-4 custom-scrollbar">
    <div class="flex space-x-4">
      @for (hour of hourlyForecast(); track hour.time) {
        <div class="flex flex-col items-center justify-between p-4 bg-white/5 rounded-lg border border-white/10 w-24 flex-shrink-0 text-center">
          <p class="font-semibold text-sm">{{ hour.time }}</p>
          <div class="w-12 h-12 my-2">
            <app-weather-icon [condition]="hour.condition" className="w-full h-full text-gray-300"></app-weather-icon>
          </div>
          <p class="text-xl font-bold">{{ hour.temp }}&deg;</p>
        </div>
      }
    </div>
  </div>
</div>
