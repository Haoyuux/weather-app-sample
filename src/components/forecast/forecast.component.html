<div class="bg-white/10 backdrop-blur-md p-6 rounded-2xl border border-white/20 shadow-lg">
  <h3 class="text-xl font-bold mb-4">5-Day Forecast</h3>
  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
    @for (day of forecast(); track day.day) {
      <div class="flex flex-col items-center p-4 bg-white/5 rounded-lg border border-white/10 transition-transform duration-300 hover:scale-105 hover:bg-white/20">
        <p class="font-bold text-lg">{{ day.day }}</p>
        <div class="w-16 h-16 my-2">
           <app-weather-icon [condition]="day.condition" className="w-full h-full text-gray-300"></app-weather-icon>
        </div>
        <div class="text-center">
          <p class="font-semibold">{{ day.tempHigh }}&deg;</p>
          <p class="text-gray-400">{{ day.tempLow }}&deg;</p>
        </div>
      </div>
    }
  </div>
</div>
